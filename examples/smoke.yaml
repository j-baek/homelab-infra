# Optional end-to-end test. Remove with: scripts/lab.py kubectl delete namespace homelab-smoke
apiVersion: v1
kind: Namespace
metadata:
  name: homelab-smoke
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: homelab-smoke
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginx:1.28.0-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: homelab-smoke
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
